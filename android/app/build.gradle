apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.farm2marketuganda.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig = true
    }
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0"
        manifestPlaceholders.deepLinkHost = "dev.farm2marketuganda.com"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    // Product flavors: community + deployment tier
    flavorDimensions "community", "deployment"
    productFlavors {
        // PRODUCTION: FarmCoin (www.farm2marketuganda.com)
        productionFlavors {
            dimension "deployment"
            buildConfigField "String", "SERVER_URL", '"https://www.farm2marketuganda.com"'
            buildConfigField "String", "CONVEX_URL", '"https://greedy-tortoise-911.convex.cloud"'
            buildConfigField "String", "DEPLOYMENT_MODE", '"production"'
            resValue "string", "app_name", "FarmCoin"
        }

        // DEVELOPMENT: F2M (farm2market-dev.vercel.app)
        f2mFlavors {
            dimension "deployment"
            applicationIdSuffix ".f2m"
            versionNameSuffix "-f2m"
            buildConfigField "String", "SERVER_URL", '"https://farm2market-dev.vercel.app"'
            buildConfigField "String", "CONVEX_URL", '"https://adamant-armadillo-601.convex.cloud"'
            buildConfigField "String", "DEPLOYMENT_MODE", '"dev"'
            resValue "string", "app_name", "F2M Dev App"
        }

        // Community flavors
        defaultCommunity {
            dimension "community"
            buildConfigField "String", "DEFAULT_COMMUNITY_SLUG", '""'
        }

        kakira {
            dimension "community"
            applicationIdSuffix ".kakira"
            versionNameSuffix "-kakira"
            buildConfigField "String", "DEFAULT_COMMUNITY_SLUG", '"kakira"'
            resValue "string", "app_name", "Kakira Farmers"
        }

        kyagalanyi {
            dimension "community"
            applicationIdSuffix ".kyagalanyi"
            versionNameSuffix "-kyagalanyi"
            buildConfigField "String", "DEFAULT_COMMUNITY_SLUG", '"kyagalanyi"'
            resValue "string", "app_name", "Kyagalanyi Farmers"
        }
    }

    // Load keystore properties for release signing
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            manifestPlaceholders.deepLinkHost = "www.farm2marketuganda.com"
            if (keystorePropertiesFile.exists() && keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')

    // Firebase Cloud Messaging for push notifications
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    implementation 'com.google.firebase:firebase-analytics:21.6.1'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
